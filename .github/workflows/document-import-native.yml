name: Document import native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'workers/document-import/**'
      - 'api/lib/novel-import/**'
      - 'package-lock.json'
      - '.github/workflows/document-import-native.yml'
  push:
    branches: [main, chevoink-windows]
    paths:
      - 'workers/document-import/**'
      - 'api/lib/novel-import/**'
      - 'package-lock.json'
      - '.github/workflows/document-import-native.yml'

permissions:
  contents: read

concurrency:
  group: document-import-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      DOCUMENT_IMPORT_NATIVE_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked Node dependencies (no application/DB boot)
        run: npm ci
      - name: Build reviewed worker only (never repository credentials in build context)
        run: |
          docker build --iidfile "$RUNNER_TEMP/document-import-image.id" workers/document-import
          echo "DOCUMENT_IMPORT_TEST_IMAGE=$(cat "$RUNNER_TEMP/document-import-image.id")" >> "$GITHUB_ENV"
          echo "DOCUMENT_IMPORT_NATIVE_REPORT=$RUNNER_TEMP/document-import-native-report.json" >> "$GITHUB_ENV"
      - name: Host-safe protocol and failure tests
        run: python3 -m unittest discover -s workers/document-import/tests -p 'test_*.py' -v
      - name: Real native DOC / scanned Chinese OCR / mixed PDF / health acceptance
        run: node node_modules/vitest/vitest.mjs run --config workers/document-import/tests/parser-vitest.config.ts
      - name: Install restricted launcher for a CI user with NO Docker group or generic sudo
        run: |
          sudo useradd --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin import-launcher-ci
          sudo install -d -o root -g root -m 0755 /usr/local/libexec /etc/chevoink-document-import
          sudo install -d -o root -g root -m 0700 /var/lib/chevoink-document-import-launcher
          sudo install -d -o import-launcher-ci -g import-launcher-ci -m 0700 /opt/chevoink/shared/document-import-staging
          sudo install -o root -g root -m 0755 workers/document-import/privileged/root-launcher.py /usr/local/libexec/chevoink-document-import-launcher
          sudo install -o root -g root -m 0755 workers/document-import/privileged/docker-wrapper.sh /usr/local/bin/chevoink-document-import-docker
          python3 -c 'import json,os,pwd; print(json.dumps(dict(image=os.environ["DOCUMENT_IMPORT_TEST_IMAGE"],uid=pwd.getpwnam("import-launcher-ci").pw_uid)))' > "$RUNNER_TEMP/launcher.json"
          sudo install -o root -g root -m 0600 "$RUNNER_TEMP/launcher.json" /etc/chevoink-document-import/launcher.json
          sed 's/^ubuntu /import-launcher-ci /' workers/document-import/privileged/sudoers.example > "$RUNNER_TEMP/launcher.sudoers"
          sudo visudo -cf "$RUNNER_TEMP/launcher.sudoers"
          sudo install -o root -g root -m 0440 "$RUNNER_TEMP/launcher.sudoers" /etc/sudoers.d/chevoink-document-import
          node --input-type=module -e 'import {build} from "esbuild"; await build({entryPoints:["workers/document-import/tests/launcher-client-acceptance.ts"],bundle:true,platform:"node",format:"cjs",target:"node22",outfile:process.env.RUNNER_TEMP+"/launcher-client.cjs"})'
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/launcher-client.cjs" /usr/local/libexec/chevoink-import-launcher-ci.cjs
      - name: Verify actual client through sudo allowlist as unprivileged CI user
        run: sudo -n -u import-launcher-ci -- "$(command -v node)" /usr/local/libexec/chevoink-import-launcher-ci.cjs "$DOCUMENT_IMPORT_TEST_IMAGE"
      - name: Retain exact tested native image for release handoff (no registry push)
        run: docker save "$DOCUMENT_IMPORT_TEST_IMAGE" | gzip > "$RUNNER_TEMP/document-import-worker.tar.gz"
      - name: Save native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-import-native-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/document-import-image.id
            ${{ runner.temp }}/document-import-native-report.json
          retention-days: 30
      - name: Save successfully tested image
        uses: actions/upload-artifact@v4
        with:
          name: document-import-worker-${{ github.sha }}
          path: ${{ runner.temp }}/document-import-worker.tar.gz
          retention-days: 7
