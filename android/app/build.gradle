apply plugin: 'com.android.application'

// release 签名参数从 gitignore 的 keystore.properties 读取（密码/密钥绝不入库）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Versioned licenses are source files, independent of generated Capacitor assets.
    sourceSets.main.assets.srcDir rootProject.file('../third-party')
    namespace = "com.chevoink.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.chevoink.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.0.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Release must never silently fall back to the debug certificate.
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.7.aar')
    // The upstream AAR exposes Kotlin classes; calling them from Java needs only the runtime.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Keep the published v1.0.5.1 app-release.apk untouched for certificate comparison.
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { outputFileName = 'chevoink-v1.0.10.apk' }
    }
}

tasks.register('verifySpeechSdk') {
    doLast {
        def aar = file('libs/sherpa-onnx-1.13.7.aar')
        if (!aar.isFile()) throw new GradleException('Missing pinned speech SDK. Run scripts/prepare-android-speech.ps1.')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        aar.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != 'c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8') {
            throw new GradleException('Speech SDK checksum mismatch; refusing to build.')
        }
    }
}
tasks.register('verifyReleaseSigning') {
    doLast {
        if (!keystorePropertiesFile.isFile() ||
            ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !keystoreProperties[it]?.trim() }) {
            throw new GradleException('Release signing configuration missing or incomplete. Debug fallback is forbidden.')
        }
        if (!file(keystoreProperties['storeFile']).isFile()) {
            throw new GradleException('Release keystore does not exist.')
        }
    }
}
tasks.register('verifyShellVersion') {
    doLast {
        def expectedUa = "ChevoinkApp/${android.defaultConfig.versionName}"
        def source = rootProject.file('../capacitor.config.ts').getText('UTF-8')
        def packaged = new groovy.json.JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
        if (!source.contains("appendUserAgent: '${expectedUa}'") || packaged.appendUserAgent != expectedUa) {
            throw new GradleException('Source, packaged UA and Android versionName must match. Sync the Capacitor config before building.')
        }
        if (android.defaultConfig.versionCode <= 12) throw new GradleException('versionCode must exceed published code 12.')
    }
}
tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn('verifySpeechSdk')
    if (task.name == 'preReleaseBuild') task.dependsOn('verifyReleaseSigning', 'verifyShellVersion')
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
