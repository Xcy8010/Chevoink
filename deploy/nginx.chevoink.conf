# HTTP：ACME 续期挑战直接放行，其余全部 301 跳转到 HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name chevoink.chevolink.com;

  # certbot 续期使用 http-01 挑战，必须放行该路径
  location /.well-known/acme-challenge/ {
    root /var/www/chevoink/current;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS 主站
server {
  # http2：多路复用并行拉取 js/css/图片，显著降低首屏串行等待
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name chevoink.chevolink.com;

  ssl_certificate /etc/letsencrypt/live/chevoink.chevolink.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chevoink.chevolink.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # 安全响应头（nginx add_header 不跨级继承：下方任何带 add_header 的 location 都必须重复这套头）
  # HSTS 不加 includeSubDomains：chevolink.com 主域下可能存在其他 http 子域服务，避免误伤
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # 已完成公测兼容范围收敛：脚本/连接仅本站，外链只放行图片与媒体；从 Report-Only 转为强制执行。
  # Tailwind 动态 style 与 React 行内尺寸仍需 unsafe-inline，后续以 nonce/hash 继续收紧。
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  root /var/www/chevoink/current;
  index index.html;

  # Offline speech assets are immutable and live outside web releases.
  location = /voice-capture-worklet.js {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # Worklet callers include a content version query when this file changes.
  # Only public model/runtime files: microphone audio is never uploaded here.
  location ^~ /voice/ {
    alias /var/www/chevoink/voice/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    autoindex off;
  }

  # Emscripten loads verified cached JS from blob URLs and compiles WASM.
  # Scope this policy to the worker response; keep the document script policy strict.
  location ~ ^/assets/voice-worker-[A-Za-z0-9_-]+\.js$ {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' blob: 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # gzip：压缩文本类响应（http 块默认只压 text/html）
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Agent 附件可能包含未发布正文/合同/研究材料，必须回源 Node 校验登录态。
  # ^~ 确保它不会落入下方匿名公开的通用 uploads alias。
  location ^~ /api/uploads/agent-attachments/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "private, no-store";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # 公开媒体静态直服：头像、封面与帖子图片绕过 Node；随机文件名内容不可变
  location /api/uploads/ {
    alias /opt/chevoink/shared/uploads/;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # 存量图经迁移脚本生成 <原文件名>.webp，旧 URL 优先命中 WebP
    try_files $uri.webp $uri =404;
  }

  # Raw import sources are bounded separately from existing 40 MiB JSON routes.
  # Stream to Node so authentication/lease checks run before buffering the file.
  # Private source downloads use the same authenticated endpoint, never uploads alias.
  location ~* ^/api/novels/[^/]+/imports/[a-f0-9-]+/source$ {
    client_max_body_size 50m;
    client_body_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    # 发帖多图 base64 上传需要更大的请求体限制
    client_max_body_size 40m;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # APK 安装包与版本清单：持久目录（部署不清空），供 APP 内更新提示下载
  location = /download/version.json {
    alias /var/www/chevoink/download/version.json;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /download/ {
    alias /var/www/chevoink/download/;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    # 入口 html 禁止缓存：SPA 路由下浏览器/WebView 请求的是 /novel/... 这类深层路径，
    # 经 try_files 回退到 index.html 时并不会命中 location = /index.html（内部重定向不改 URI），
    # 导致 APP WebView 按启发式长期缓存旧入口页，部署再多修复也拿不到新代码；
    # 带 hash 的 /assets/ 由下方独立 location 覆盖为长缓存，不受影响
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }

  # 带 hash 的构建产物可长期缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
