<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/chevoink-agent.png" />
    <!-- interactive-widget=resizes-content：Android Chrome 108+ 软键盘弹出时直接缩小布局视口，输入栏自动被顶起；iOS 由 lib/keyboard-inset.ts 兼容 -->
    <!-- maximum-scale=1 + user-scalable=no：APP/手机端按原生应用体验禁用双指缩放与双击放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta
      name="description"
      content="启创墨域是一个面向创作者与读者的 AI 小说创作与阅读社区。"
    />
    <title>启创墨域 - AI 小说创作与阅读社区</title>
    <!-- 启动和 Agent 对话共用的加载图标样式在首屏直接可用。 -->
    <style>
      :root {
        --boot-background: #f4f0e8;
        --boot-mark-base: #7b8593;
        --boot-mark-highlight: #111827;
        background-color: var(--app-bg, var(--boot-background));
        color-scheme: light;
      }
      html.dark {
        --boot-background: #111318;
        --boot-mark-base: #8993a2;
        --boot-mark-highlight: #f3f5f7;
        color-scheme: dark;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--app-bg, var(--boot-background));
      }
      .agent-loading-mark {
        display: block;
        width: 48px;
        height: 48px;
        background-image: linear-gradient(
          100deg,
          var(--text-tertiary, var(--boot-mark-base)) 38%,
          var(--text-primary, var(--boot-mark-highlight)) 50%,
          var(--text-tertiary, var(--boot-mark-base)) 62%
        );
        background-size: 220% 100%;
        -webkit-mask: url('/chevoink-agent.png') center / contain no-repeat;
        mask: url('/chevoink-agent.png') center / contain no-repeat;
      }
      @media (prefers-reduced-motion: no-preference) {
        .agent-loading-mark {
          animation: agent-icon-shimmer 1.5s linear infinite;
        }
        @keyframes agent-icon-shimmer {
          0% { background-position: 220% 0; }
          100% { background-position: -120% 0; }
        }
      }
    </style>
    <!-- 同源脚本在首屏渲染前读取与设置页一致的持久化主题。 -->
    <script src="/boot-theme.js"></script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="app-loading" class="boot-splash" role="status" aria-label="加载中">
      <span class="agent-loading-mark" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
